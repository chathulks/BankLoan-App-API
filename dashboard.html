<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>BankLoan App</title>
</head>

<body onload="loadUserTable()">
    <!-- Nav Bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><img src="logo/pngwing.com(1).png" alt="bank-image"
                    style="width: 90px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
                    <a class="nav-link" href="#">Features</a>
                    <a class="nav-link" href="#">Pricing</a>
                    <a class="nav-link" href="#">Disabled</a>
                </div>
            </div>
        </div>
    </nav>
    <!-- Nav Bar -->

    <!--User Table Section  -->
    <div class="d-flex justify-content-center pt-3">
        <div class="card shadow-lg border-0 p-4 rounded-3" style="width: 100%; max-width: 1450px;">
            <div class="row">
                <div class="col-2">
                    <button class="btn border-0 p-0" data-bs-toggle="modal" data-bs-target="#modal-1">
                        <i class="bi bi-person-plus-fill text-success" style="font-size: 24px;"></i>
                        <span>New User</span>
                    </button>
                </div>
                <div class="col-2">
                    <button class="btn border-0 p-0" data-bs-toggle="modal" data-bs-target="#modal-2">
                        <i class="bi bi-person-plus-fill text-primary" style="font-size: 24px;"></i>
                        <span>New Customer</span>
                    </button>
                </div>
            </div>
            <div class="table-responsive" style="height: 500px;">
                <table class="table table-hover caption-top" id="user-table" style="min-width: 1200px;">
                </table>
            </div>
        </div>
    </div>
    <!--User Table Section  -->

    <!-- Modal User Registrations -->
    <div class="modal fade" id="modal-1" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header d-flex justify-content-center align-items-center">
                    <div class="row d-flex justify-content-center align-items-center">
                        <img src="logo/pngwing.com(1).png" alt="bank-image" style="width: 150px;">
                        <span class="fs-4 fw-semibold text-center">Registration User</span>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="row p-4">
                        <div class="col-3 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">ID</label>
                            <input type="text" class="form-control" id="u_id" placeholder="1234">
                        </div>
                        <div class="col-9 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="u_name" placeholder="John">
                        </div>
                        <div class="col-12 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="u_fullname" placeholder="Jhon Rock">
                        </div>
                        <div class="col-6 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="u_email" placeholder="johan@gmail.com">
                        </div>
                        <div class="col-6 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Password</label>
                            <input type="text" class="form-control" id="u_pw" placeholder="jh!@#41%^Sd">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success">New</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal User Registrations -->

    <!-- Modal Customer Registration-->
    <div class="modal fade" id="modal-2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header d-flex justify-content-center align-items-center">
                    <div class="row d-flex justify-content-center align-items-center">
                        <img src="logo/pngwing.com(1).png" alt="bank-image" style="width: 150px;">
                        <span class="fs-4 fw-semibold text-center">Registration Customer</span>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="row p-4">
                        <div class="col-3 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">ID</label>
                            <input type="text" class="form-control" id="u_id" placeholder="1234">
                        </div>
                        <div class="col-9 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="u_name" placeholder="John">
                        </div>
                        <div class="col-12 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="u_fullname" placeholder="Jhon Rock">
                        </div>
                        <div class="col-6 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="u_email" placeholder="johan@gmail.com">
                        </div>
                        <div class="col-6 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Password</label>
                            <input type="text" class="form-control" id="u_pw" placeholder="jh!@#41%^Sd">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">New</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Customer Registration-->

    <!-- Modal User Update -->
    <div class="modal fade" id="modal-3" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header d-flex justify-content-center align-items-center">
                    <div class="row d-flex justify-content-center align-items-center">
                        <img src="logo/pngwing.com(1).png" alt="bank-image" style="width: 150px;">
                        <span class="fs-4 fw-semibold text-center">Update User</span>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="row p-4">
                        <div class="col-3 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">ID</label>
                            <input type="text" class="form-control" id="uu_id" placeholder="1234" disabled>
                        </div>
                        <div class="col-9 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="uu_name" placeholder="John">
                        </div>
                        <div class="col-12 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="uu_fullname" placeholder="Jhon Rock">
                        </div>
                        <div class="col-6 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="uu_email" placeholder="johan@gmail.com">
                        </div>
                        <div class="col-6 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Password</label>
                            <input type="text" class="form-control" id="uu_pw" placeholder="jh!@#41%^Sd">
                        </div>
                        <div class="col-8 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Created Date</label>
                            <input type="text" class="form-control" id="uu_cd"
                                placeholder="2026-08-26T10:35:49.13" disabled>
                        </div>
                        <div class="col-4 pb-3">
                            <label for="exampleFormControlInput1" class="form-label fw-semibold">Role</label>
                            <input type="text" class="form-control" id="uu_role"
                                placeholder="Customer">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-warning">Update</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal User Update -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/app.js"></script>
</body>

</html>
