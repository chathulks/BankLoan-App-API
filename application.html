<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>BankLoan App</title>
</head>

<body onload="loadApplicationTable()">
    <!-- Nav Bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="./dashboard.html"><img src="logo/pngwing.com(1).png" alt="bank-image"
                    style="width: 90px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="./dashboard.html">Dashboard</a>
                    <a class="nav-link" href="./application.html">Application</a>
                </div>
            </div>
        </div>
    </nav>
    <!-- Nav Bar -->

    <!--Application Table Section  -->
    <div class="d-flex justify-content-center pt-3">
        <div class="card shadow-lg border-0 p-4 rounded-3" style="width: 100%; max-width: 1450px;">
            <div class="row">
                <div class="col-1">
                    <button class="btn border-0 p-0" data-bs-toggle="modal" data-bs-target="#modal-4"
                        onclick="allCallMy()">
                        <i class="bi bi-file-earmark-pdf-fill text-warning" style="font-size: 24px;"></i>
                        <span>New</span>
                    </button>
                </div>
                <div class="col-4">
                    <select class="form-select" name="userIDsearch" id="search_user_id"
                        onchange="userIDUseSearchApplication()">
                    </select>
                </div>
                <div class="col-4">
                    <select class="form-select" name="userIDsearch" id="search_emp_id"
                        onchange="employeeIDUseSearchApplication()">
                    </select>
                </div>
            </div>
            <div class="table-responsive" style="height: 500px;">
                <table class="table table-hover caption-top" id="application-table" style="min-width: 1200px;">
                </table>
            </div>
        </div>
    </div>
    <!--Application Table Section  -->

    <!-- New Application -->
    <div class="modal fade" id="modal-4" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header d-flex justify-content-center align-items-center">
                    <div class="row d-flex justify-content-center align-items-center">
                        <img src="logo/pngwing.com(1).png" alt="bank-image" style="width: 150px;">
                        <span class="fs-4 fw-semibold text-center">Create New Application</span>
                    </div>
                </div>
                <div class="modal-body">
                    <fieldset class="border border-2 rounded-4">
                        <legend class="float-none w-auto px-2 fs-4 fw-semibold">Applications</legend>
                        <div class="row p-4">
                            <div class="col-4">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" id="full_name">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Application
                                    Status</label>
                                <select class="form-select" id="as_data">
                                    <option selected>Select</option>
                                    <option value="Salaried">Salaried</option>
                                    <option value="Self-Employed">Self-Employed</option>
                                    <option value="Business">Business</option>
                                    <option value="Unemployed">Unemployed</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">PAN Card</label>
                                <input type="text" class="form-control" id="pan_card">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">DOB</label>
                                <input type="date" class="form-control" id="dob">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Email</label>
                                <input type="text" class="form-control" id="email">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Phone</label>
                                <input type="text" class="form-control" id="mobile">
                            </div>
                            <div class="col-4">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Address</label>
                                <input type="text" class="form-control" id="address">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">City</label>
                                <select class="form-select" id="city">
                                    <option selected>Select</option>
                                    <option value="Colombo">Colombo</option>
                                    <option value="Kandy">Kandy</option>
                                    <option value="Galle">Galle</option>
                                    <option value="Jaffna">Jaffna</option>
                                    <option value="Negombo">Negombo</option>
                                    <option value="Anuradhapura">Anuradhapura</option>
                                    <option value="Batticaloa">Batticaloa</option>
                                    <option value="Kurunegala">Kurunegala</option>
                                    <option value="Ratnapura">Ratnapura</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">State</label>
                                <input type="text" class="form-control" id="state">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Zip-Code</label>
                                <input type="text" class="form-control" id="zip_code">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Annual Income</label>
                                <input type="number" class="form-control" id="a_income">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Employeement
                                    Status</label>
                                <select class="form-select" id="e_status">
                                    <option selected>Select</option>
                                    <option value="Employed Full-time">Employed Full-time</option>
                                    <option value="Employed Part-time">Employed Part-time</option>
                                    <option value="Self-employed">Self-employed</option>
                                    <option value="Unemployed">Unemployed</option>
                                    <option value="Student">Student</option>
                                    <option value="Retired">Retired</option>
                                    <option value="Homemaker">Homemaker</option>
                                </select>
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Credit Score</label>
                                <input type="number" class="form-control" id="c_score">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Assets</label>
                                <input type="text" class="form-control" id="assets">
                            </div>
                            <div class="col-4">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Applied Date</label>
                                <input type="text" class="form-control" id="app_date" disabled>
                            </div>
                        </div>
                    </fieldset>
                    <fieldset class="border border-2 rounded-4">
                        <legend class="float-none w-auto px-2 fs-4 fw-semibold">Loan</legend>
                        <div class="row p-4">
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Loan ID</label>
                                <input type="number" class="form-control" id="l_id">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Application
                                    ID</label>
                                <input type="number" class="form-control" id="app_id">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Bank Name</label>
                                <input type="text" class="form-control" id="bank_name">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Loan Amount</label>
                                <input type="number" class="form-control" id="l_amount">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">EMI</label>
                                <input type="number" class="form-control" id="emi">
                            </div>
                            <div class="col-2">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Customer ID</label>
                                <select class="form-select" id="cus_id">

                                </select>
                            </div>
                        </div>
                    </fieldset>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-warning" onclick="saveApplication()">Save</button>
                </div>
            </div>
        </div>
    </div>
    <!-- New Application -->

    <!-- Change Application Status -->
    <div class="modal fade" id="modal-5" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header d-flex justify-content-center align-items-center">
                    <div class="row d-flex justify-content-center align-items-center">
                        <img src="logo/pngwing.com(1).png" alt="bank-image" style="width: 150px;">
                        <span class="fs-4 fw-semibold text-center">Change Application Status</span>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="p-4">
                        <div class="mb-4">
                            <label for="exampleInputEmail1" class="form-label fw-semibold">PAN Card Number</label>
                            <input type="text" class="form-control" id="pan_num" placeholder="AWEF4875ASD" disabled>
                        </div>
                        <div>
                            <label for="exampleInputEmail1" class="form-label fw-semibold">Application Status</label>
                            <select class="form-select" id="app_status">
                                <option selected>Select Status</option>
                                <option value="Approved">Approved</option>
                                <option value="Approve">Approve</option>
                                <option value="Reject">Reject</option>
                                <option value="Pending">Pending</option>
                                <option value="Salaried">Salaried</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="changeApplicationStatus()">Change</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Change Application Status -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./app.js"></script>
</body>

</html>
